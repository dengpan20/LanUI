name: Design System CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run CI gate (retry transient runner failures once)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "CI gate attempt $attempt/2"
            pnpm run ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 2) {
              Write-Host 'CI gate failed; retrying once to absorb transient runner/browser startup failures.'
              Start-Sleep -Seconds 5
            }
          }
          exit 1
        env:
          LAN_UI_BROWSER_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          # Windows runner/Edge text rasterization differs from the checked-in workstation baseline.
          # Keep this explicit and capped; local visual regression retains the strict 0.2% default.
          LAN_UI_VISUAL_MAX_DIFF_RATIO: 0.035
  interaction-cross-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm run test:interaction:non-chromium
  compatibility:
    name: compatibility-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.12.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.0 }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:compatibility
        env:
          LAN_UI_EXPECTED_NODE: ${{ matrix.node }}
